[versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.10.2"
ksp = "2.3.12"
kotlinx-datetime = "0.8.0-0.6.x-compat"
mod-publish = "2.2.1"
fletching-table = "0.1.0-alpha.23"
stonecutter = "0.9.8"
zstd-jni = "1.5.7-24"
fastutil = "8.5.9"
netty = "4.1.82.Final"
netty-standalone = "4.2.19.Final"
slf4j = "2.0.1"
ktoml = "0.7.1"
night-config = "3.6.4"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime-jvm = { module = "org.jetbrains.kotlinx:kotlinx-datetime-jvm", version.ref = "kotlinx-datetime" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
mod-publish-gradle-plugin = { module = "me.modmuss50:mod-publish-plugin", version.ref = "mod-publish" }
fletching-table = { module = "dev.kikugie:fletching-table", version.ref = "fletching-table" }
stonecutter = { module = "dev.kikugie:stonecutter", version.ref = "stonecutter" }
ktoml-core-jvm = { module = "com.akuleshov7:ktoml-core-jvm", version.ref = "ktoml" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty-standalone" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
night-config-core = { module = "com.electronwill.night-config:core", version.ref = "night-config" }
night-config-toml = { module = "com.electronwill.night-config:toml", version.ref = "night-config" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
