[mod]
id = "xmmp"
version = "1.1.0"
license = "MIT"
name = "Xaero's Maps: Multiplayer+"
description = "Adds more multiplayer features to Xaero's Minimap/World Map"
author = "alinco8"

[mod.links]
sources = "https://github.com/Alinco8/XaerosMaps-MultiplayerPlus"
homepage = "https://github.com/Alinco8/XaerosMaps-MultiplayerPlus"
issues = "https://github.com/Alinco8/XaerosMaps-MultiplayerPlus/issues"
forge_updates = "https://api.modrinth.com/updates/stTaMuWa/forge_updates.json"
neoforge_updates = "https://api.modrinth.com/updates/stTaMuWa/forge_updates.json?neoforge=only"

[publish]
modrinth.id = "stTaMuWa"
curseforge.id = 1525919

[libs]
# renovate: datasource=maven depName=com.electronwill.night-config:toml
night_config = "3.9.0"
# renovate: datasource=maven depName=com.github.luben:zstd-jni
zstd = "1.5.7-20"

[deps]
# renovate: datasource=maven depName=xaero.minimap:xaerominimap-fabric-1.20.1 registryUrl=https://chocolateminecraft.com/maven
xaero_minimap = { version = "26.5.0", range = ["25"] }
# renovate: datasource=maven depName=xaero.map:xaeroworldmap-fabric-1.20.1 registryUrl=https://chocolateminecraft.com/maven
xaero_world_map = { version = "1.46.0", range = ["1.40"] }
# renovate: datasource=maven depName=xaero.lib:xaerolib-fabric-1.20.1 registryUrl=https://chocolateminecraft.com/maven
xaero_lib = { version = "1.1.15", range = ["1.0"] }

[fabric.deps]
# renovate: datasource=maven depName=net.fabricmc:fabric-loader registryUrl=https://maven.fabricmc.net
fabric_loader = { version = "0.19.5", range = ["0.19"] }
